[package]
name = "dozen"
version = "0.5.0"
edition = "2024"
description = "Multi-language Doxygen-reference generator"

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
glob = "0.3"
regex = "1"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.0"
tree-sitter-cpp = "=0.23.4"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"

[dev-dependencies]
tempfile = "3"
